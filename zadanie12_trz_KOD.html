<textarea cols="100" rows="30" readonly>
&lt;!DOCTYPE html&gt;
&lt;html lang="pl"&gt;
&lt;head&gt;
&lt;meta charset="utf-8"&gt;
&lt;title&gt;Trza Zadanie 12&lt;/title&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div style="color:green;font-size:45px;"&gt;
&lt;script language="JavaScript"&gt;
var D1_trz=parseFloat(prompt("D1=",""));
var G1_trz=parseFloat(prompt("G1=",""));
var D2_trz=parseFloat(prompt("D2=",""));
var G2_trz=parseFloat(prompt("G2=",""));
var sekund=((D1_trz*24+G1_trz)-(D2_trz*24+G2_trz))*60*60;
document.write("D1="+D1_trz+" G1="+G1_trz+" D2="+D2_trz+" G2="+G2_trz+"&lt;br&gt;");
document.write("Ilość sekund = "+sekund+"&lt;br&gt;");
&lt;/script&gt;
&lt;/div&gt;
&lt;/body&gt;

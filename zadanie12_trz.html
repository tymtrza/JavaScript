<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Trza Zadanie 12</title>
</head>
<body>
<div style="color:green;font-size:45px;">
<script language="JavaScript">
var D1_trz=parseFloat(prompt("D1=",""));
var G1_trz=parseFloat(prompt("G1=",""));
var D2_trz=parseFloat(prompt("D2=",""));
var G2_trz=parseFloat(prompt("G2=",""));
var sekund=((D1_trz*24+G1_trz)-(D2_trz*24+G2_trz))*60*60;
document.write("D1="+D1_trz+" G1="+G1_trz+" D2="+D2_trz+" G2="+G2_trz+"<br>");
document.write("Ilość sekund = "+sekund+"<br>");
</script>
</div>
</body>
</html>

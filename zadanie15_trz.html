<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Trza Zadanie 15</title>
</head>
<body>
<div style="font-size:40px;">
Ułamek egipski 1/m rozkładamy na dwa takie same ułamki egipskie.<br>
<script language="JavaScript">
var m_trz=parseFloat(prompt("m=",""));
var p_trz=2*m_trz;
document.write("m="+m_trz+"<br>");
document.write("1/"+m_trz+" = 1/"+p_trz+" + 1/"+p_trz+"<br>");
</script>
</div>
</body>
</html>

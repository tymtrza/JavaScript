&lt;div style="font-size:40px;"&gt;
Ułamek egipski 1/m rozkładamy na dwa takie same ułamki egipskie.&lt;br&gt;
&lt;script language="JavaScript"&gt;
var m_trz=parseFloat(prompt("m=",""));
var p_trz=2*m_trz;
document.write("m="+m_trz+"&lt;br&gt;");
document.write("1/"+m_trz+" = 1/"+p_trz+" + 1/"+p_trz+"&lt;br&gt;");

<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Trza Zadanie 14</title>
</head>
<body>
<div style="font-size:40px;">
Ułamek egipski 1/m rozkładamy na trzy ułamki egipskie.<br>
<script language="JavaScript">
var m_trz=parseFloat(prompt("m=",""));
var p_trz=m_trz+1;
var q_trz=m_trz*(m_trz+1);
var r_trz=p_trz+1;
var s_trz=p_trz*(p_trz+1);
document.write("m="+m_trz+"<br>");
document.write("1/"+m_trz+" = 1/"+r_trz+" + 1/"+s_trz+" + 1/"+q_trz+"<br>");
</script>
</div>
</body>
</html>

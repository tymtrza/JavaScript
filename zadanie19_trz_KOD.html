<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Trza KOD zadanie 19</title>
</head>
<body>
<textarea cols="100" rows="30" readonly>
&lt;!DOCTYPE html&gt;
&lt;html lang="pl"&gt;
&lt;head&gt;
&lt;meta charset="utf-8"&gt;
&lt;title&gt;Trza Zadanie 19&lt;/title&gt;
&lt;script type="text/javascript"&gt;
function Pole_trza()
{
var a_trz=parseFloat(document.getElementById('dlugosc').value);
var b_trz=a_trz*a_trz;
document.getElementById("nazwa").innerHTML ="Pole kwadratu= "+b_trz.toFixed(2)+" cm^2";
}
function obwod_trza()
{
var a_trz=parseFloat(document.getElementById('dlugosc').value);
var b_trz=4*a_trz;
document.getElementById("nazwa").innerHTML ="Obwód kwadratu= "+b_trz.toFixed(2)+" cm";
}
&lt;/script&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;h1&gt;Wszystko o KWADRACIE&lt;/h1&gt;&lt;br&gt;&lt;br&gt;
Podaj długość boku: &lt;input type="text" id="dlugosc" value=""&gt; cm&lt;br&gt;&lt;br&gt;&lt;br&gt;
&lt;input type="button" name="pole" value="Oblicz pole" onclick="Pole_trza()"&gt;&lt;br&gt;&lt;br&gt;
&lt;input type="button" name="obwod" value="Oblicz obwod" onclick="obwod_trza()"&gt;&lt;br&gt;&lt;br&gt;
&lt;div style="color:red;font-size:50px;" id="nazwa"&gt;&lt;/div&gt;
&lt;/body&gt;
&lt;/html&gt;
</textarea>
</body>
</html>

&lt;!DOCTYPE html&gt;

&lt;body&gt;
&lt;div style="font-size:40px;"&gt;
Ułamek egipski 1/m rozkładamy na trzy ułamki egipskie.&lt;br&gt;
&lt;script language="JavaScript"&gt;
var m_trz=parseFloat(prompt("m=",""));
var p_trz=m_trz+1;
var q_trz=m_trz*(m_trz+1);
var r_trz=p_trz+1;
var s_trz=p_trz*(p_trz+1);
document.write("m="+m_trz+"&lt;br&gt;");
document.write("1/"+m_trz+" = 1/"+r_trz+" + 1/"+s_trz+" + 1/"+q_trz+"&lt;br&gt;");
&lt;/script&gt;
&lt;/div&gt;
&lt;/body&gt;

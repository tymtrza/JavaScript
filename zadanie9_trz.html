<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Trza</title>
<script type="text/javascript">
function show_prompt()
{
var name=prompt("Napisz imię","Jan Trza");
if (name!=null && name!="")
{
document.write("Witaj " + name + "! jak się masz?");
}
}
</script>
</head>
<body>
<input type="button" onclick="show_prompt()" value="Pokaż prompt box" />
<p><b>Prompt Box</b> - zastosowanie: jest używany, kiedy użytkownik ma wpisać coś, np. hasło, zanim wejdzie w dany moduł strony. Jeżeli użytkownik kliknie OK, metoda zwraca wpisaną wartość, a w przeciwnym wypadku zwraca null.</p>
</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Trza Zadanie 18</title>
</head>
<body>
<div style="color:navy;font-size:40px;">
<script language="JavaScript">
var a=parseFloat(prompt("a=",""));
var b=parseFloat(prompt("b=",""));
function suma_trz(a, b)
{
return a + b;
}
function odejmowanie_trz(a, b)
{
return a - b;
}
function mnozenie_trz(a, b)
{
return a * b;
}
function od_kwadratu_trz(a, b)
{
return a+"^2 = "+(a*a)+"<br>"+b+"^2 = "+(b*b);
}
function reszta_z_dzielenia_a_przez_b_trz(a, b)
{
return a % b;
}
document.write("suma="+suma_trz(a,b)+"<br>");
document.write("odejmowanie="+odejmowanie_trz(a,b)+"<br>");
document.write("mnozenie="+mnozenie_trz(a,b)+"<br>");
document.write(od_kwadratu_trz(a,b)+"<br>");
document.write("reszta z dzielenia a przez b="+reszta_z_dzielenia_a_przez_b_trz(a,b)+"<br>");
</script>
</div>
</body>
</html>

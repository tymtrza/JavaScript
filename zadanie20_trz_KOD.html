<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Trza KOD zadanie 20</title>
</head>
<body>
<textarea cols="100" rows="30" readonly>
&lt;!DOCTYPE html&gt;
&lt;html lang="pl"&gt;
&lt;head&gt;
&lt;meta charset="utf-8"&gt;
&lt;title&gt;Trza Zadanie 20&lt;/title&gt;
&lt;script type="text/javascript"&gt;
function AB_trz(xa_trz, ya_trz, xb_trz, yb_trz)
{
return Math.sqrt(Math.pow(xb_trz-xa_trz,2)+Math.pow(yb_trz-ya_trz,2));
}
function BC_trz(xb_trz, yb_trz, xc_trz, yc_trz)
{
return Math.sqrt(Math.pow(xc_trz-xb_trz,2)+Math.pow(yc_trz-yb_trz,2));
}
function AC_trz(xa_trz, ya_trz, xc_trz, yc_trz)
{
return Math.sqrt(Math.pow(xc_trz-xa_trz,2)+Math.pow(yc_trz-ya_trz,2));
}
function oblicz_trz()
{
var xa_trz=parseFloat(document.getElementById("xa").value);
var ya_trz=parseFloat(document.getElementById("ya").value);
var xb_trz=parseFloat(document.getElementById("xb").value);
var yb_trz=parseFloat(document.getElementById("yb").value);
var xc_trz=parseFloat(document.getElementById("xc").value);
var yc_trz=parseFloat(document.getElementById("yc").value);
var tekst="AB = "+AB_trz(xa_trz,ya_trz,xb_trz,yb_trz).toFixed(2)+"&lt;br&gt;";
tekst=tekst+"BC = "+BC_trz(xb_trz,yb_trz,xc_trz,yc_trz).toFixed(2)+"&lt;br&gt;";
tekst=tekst+"AC = "+AC_trz(xa_trz,ya_trz,xc_trz,yc_trz).toFixed(2)+"&lt;br&gt;";
document.getElementById("wynik").innerHTML=tekst;
}
&lt;/script&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;form name="formularz"&gt;
Punkt A: x=&lt;input size="5" id="xa"&gt; y=&lt;input size="5" id="ya"&gt;&lt;br&gt;&lt;br&gt;
Punkt B: x=&lt;input size="5" id="xb"&gt; y=&lt;input size="5" id="yb"&gt;&lt;br&gt;&lt;br&gt;
Punkt C: x=&lt;input size="5" id="xc"&gt; y=&lt;input size="5" id="yc"&gt;&lt;br&gt;&lt;br&gt;
&lt;input type="button" value="Oblicz boki" onclick="oblicz_trz()"&gt;
&lt;/form&gt;
&lt;div style="color:blue;font-size:30px;" id="wynik"&gt;&lt;/div&gt;
&lt;/body&gt;
&lt;/html&gt;
</textarea>
</body>
</html>

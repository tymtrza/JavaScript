&lt;!DOCTYPE html&gt;
&lt;html lang="pl"&gt;

&lt;title&gt;Trza Zadanie 17&lt;/title&gt;

&lt;body&gt;
&lt;h2&gt;Trza - zadanie 17&lt;/h2&gt;
&lt;b&gt;1. Wymień cztery sposoby wyprowadzania danych w JS.&lt;/b&gt;&lt;br&gt;
&lt;ul&gt;
&lt;li&gt;&lt;u&gt;z użyciem document.write()&lt;/u&gt;&lt;/li&gt;
&lt;li&gt;&lt;u&gt;z użyciem okienka alert()&lt;/u&gt;&lt;/li&gt;
&lt;li&gt;&lt;u&gt;do okienek formularza&lt;/u&gt;&lt;/li&gt;
&lt;li&gt;&lt;u&gt;do tabeli&lt;/u&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;b&gt;2. Czym jest funkcja w JS, omów przy użyciu 4 podpunktów.&lt;/b&gt;&lt;br&gt;
&lt;ol&gt;
&lt;li&gt;Jest to &lt;u&gt;zbiór zgrupowanych instrukcji&lt;/u&gt;, które możemy uruchamiać poprzez podanie ich nazwy.&lt;/li&gt;
&lt;li&gt;Każda funkcja po wywołaniu &lt;u&gt;wykonuje swój wewnętrzny kod&lt;/u&gt;.&lt;/li&gt;
&lt;li&gt;Funkcja może mieć &lt;u&gt;argumenty&lt;/u&gt;, które wchodzą do wnętrza funkcji i są tam przetwarzane, np. suma_trz(a, b).&lt;/li&gt;
&lt;li&gt;Może (nie zawsze) &lt;u&gt;zwrócić obliczoną wartość&lt;/u&gt; zapisaną po słowie kluczowym return.&lt;/li&gt;
&lt;/ol&gt;
&lt;b&gt;3. Omów metody getElementsByName, getElementById, getElementsByTagName.&lt;/b&gt;&lt;br&gt;
&lt;table border="1" cellpadding="5"&gt;
&lt;tr&gt;&lt;th&gt;Metoda&lt;/th&gt;&lt;th&gt;Opis&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;u&gt;getElementById("id")&lt;/u&gt;&lt;/td&gt;&lt;td&gt;dostęp do elementu o konkretnej wartości atrybutu id&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;u&gt;getElementsByTagName("znacznik")&lt;/u&gt;&lt;/td&gt;&lt;td&gt;dostęp do wszystkich elementów o danym znaczniku, np. P lub DIV&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;u&gt;getElementsByName("nazwa")&lt;/u&gt;&lt;/td&gt;&lt;td&gt;dostęp do wszystkich elementów o konkretnej wartości atrybutu name&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;br&gt;
&lt;b&gt;4. Omów właściwości innerHTML, innerText, className.&lt;/b&gt;&lt;br&gt;
&lt;b&gt;innerHTML&lt;/b&gt;&lt;br&gt;
&lt;u&gt;Umożliwia odczyt, zmodyfikowanie, wstawienie albo usunięcie kodu HTML z danego elementu, np. w tabeli.&lt;/u&gt;&lt;br&gt;&lt;br&gt;
&lt;b&gt;innerText&lt;/b&gt;&lt;br&gt;
&lt;u&gt;Umożliwia określenie ciągu znaków, który zostanie umieszczony w elemencie.&lt;/u&gt;&lt;br&gt;&lt;br&gt;
&lt;b&gt;className&lt;/b&gt;&lt;br&gt;
&lt;u&gt;Umożliwia określenie klasy CSS użytej do prezentacji elementu.&lt;/u&gt;&lt;br&gt;
&lt;/body&gt;
&lt;/html&gt;
</textarea>
</body>
